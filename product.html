<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Product — AUTOVB.WRX</title>
<meta name="description" content="Configure your AURACORE part and add it to your order.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=23">
</head>
<body>

<main id="ppMain"></main>

<!-- photo viewer (gallery + review photos) -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lb-close" id="lbClose" aria-label="Close">×</button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous photo">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next photo">›</button>
  <div class="lb-cap" id="lbCap"></div>
</div>

<!-- write a review -->
<div class="rv-modal-bg" id="rvModal">
  <div class="rv-modal" role="dialog" aria-modal="true" aria-labelledby="rvTitle">
    <h3 id="rvTitle">Write a review</h3>
    <p class="sub" id="rvSub">Reviews are posted after we match them to your order.</p>
    <label class="formlabel">Your rating *</label>
    <div class="star-pick" id="starPick">
      <button type="button" data-v="1" aria-label="1 star">★</button><button type="button" data-v="2" aria-label="2 stars">★</button><button type="button" data-v="3" aria-label="3 stars">★</button><button type="button" data-v="4" aria-label="4 stars">★</button><button type="button" data-v="5" aria-label="5 stars">★</button>
    </div>
    <label class="formlabel" for="rvHeadline">Headline *</label>
    <input id="rvHeadline" type="text" maxlength="80" placeholder="Sum it up in a few words">
    <label class="formlabel" for="rvBody">Your review *</label>
    <textarea id="rvBody" placeholder="How was the fit, the install, the look?"></textarea>
    <div class="formrow">
      <div><label class="formlabel" for="rvName">Name (as shown) *</label><input id="rvName" type="text" autocomplete="name" placeholder="First name + last initial"></div>
      <div><label class="formlabel" for="rvEmail">Order email *</label><input id="rvEmail" type="email" autocomplete="email" placeholder="So we can verify the order"></div>
    </div>
    <div id="rvConfigWrap">
      <label class="formlabel" for="rvConfig">What did you get?</label>
      <select id="rvConfig"></select>
    </div>
    <div id="rvPhotoWrap">
      <label class="formlabel">Install photos <span class="opt">(optional · up to 3)</span></label>
      <div class="rv-pick" id="rvPick"></div>
      <input type="file" id="rvFiles" accept="image/*" multiple hidden>
      <p class="rv-pick-hint">Once your review is approved, your photos show in the gallery on this page.</p>
    </div>
    <input type="text" id="rvWebsite" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="actions">
      <button type="button" class="btn-dark" id="rvCancel">Cancel</button>
      <button type="button" class="btn-wrb" id="rvSubmit">Submit review</button>
    </div>
    <div class="statusmsg" id="rvStatus"></div>
  </div>
</div>

<script src="app.js?v=23"></script>
<script>
mountChrome("shop.html");

const params = new URLSearchParams(location.search);
const p = productBySlug(params.get("p"));

if(!p){
  $("ppMain").innerHTML = `
    <div class="pp">
      <div class="crumb"><a href="index.html">Home</a></div>
      <h1 style="font-size:28px;font-weight:800">Product not found</h1>
      <p style="color:var(--gray);margin-top:10px">That product doesn't exist. <a href="shop.html" style="color:var(--wrb)">Back to the catalog →</a></p>
    </div>`;
} else {
  document.title = p.name + " — AUTOVB.WRX";
  let sel = {};
  (p.options||[]).forEach(o => sel[o.label] = choiceName(optionChoiceList(o).find(c=>!c.soldOut) || optionChoiceList(o)[0]));
  normalizeSel(p, sel);
  let qty = 1;
  let mainOverride = null;   // set when a gallery thumb is clicked; cleared on option change

  const sectionLabel = {lineup:"Reflectors", interior:"Interior & Lighting", system:"The System"}[p.section] || "Products";
  const sectionHref  = {lineup:"shop.html", interior:"shop.html", system:"system.html"}[p.section] || "shop.html";

  function currentMainSrc(){
    if(mainOverride) return mainOverride;
    if(p.photoKey && p.photos){
      const key = p.photoKey.map(l=>sel[l]).join("|");
      return p.photos[key] || "";
    }
    return p.img || "";
  }
  function shownLabel(){
    if(p.photoKey) return p.photoKey.map(l=>sel[l]).join(" · ");
    return "";
  }

  function optBtn(o, c){
    const name = choiceName(c);
    const soldOut = typeof c==="object" && c.soldOut;
    const priceTag = (typeof c==="object" && c.price!=null) ? `<small>${soldOut ? "Out of stock" : fmt(c.price)}</small>` : "";
    return `<button class="optbtn ${sel[o.label]===name?'sel':''}${soldOut?' soldout':''}" data-group="${o.label}" data-choice="${name}"${soldOut?' disabled aria-disabled="true" title="Out of stock — coming soon"':''}>${name}${priceTag}</button>`;
  }
  function optionsHTML(){
    return (p.options||[]).map(o=>{
      const rows = o.sections
        ? o.sections.map(s=>`<span class="optsub">${s.title}</span><div class="optrow">${s.choices.map(c=>optBtn(o,c)).join("")}</div>`).join("")
        : `<div class="optrow">${visibleChoices(p, o, sel).map(c=>optBtn(o,c)).join("")}</div>`;
      const picked = findChoice(p, o.label, sel[o.label]);
      const note = picked && typeof picked==="object" && picked.note ? `<p class="optnote">${picked.note}</p>` : "";
      return `<div class="optgroup"><span class="optlabel">${o.label}</span>${rows}${note}</div>`;
    }).join("");
  }
  function noticesHTML(){
    return (p.requires ? `<div class="noticebox"><b>Heads up</b>${p.requires}</div>` : "") +
           (p.delayed ? `<div class="noticebox warn"><b>Backordered</b>${p.delayed}</div>` : "") +
           (p.promo ? `<div class="noticebox promo"><b>Photo bounty — $5 off</b>${p.promo}</div>` : "");
  }
  function photoHTML(){
    const src = currentMainSrc();
    const cap = shownLabel();
    const thumbs = (p.gallery && p.gallery.length)
      ? `<div class="pp-thumbs">${p.gallery.map((g,i)=>`<button class="pp-thumb" data-src="${g}"><img src="${g}" alt="${p.name} photo ${i+1}"></button>`).join("")}</div>`
      : "";
    return `
      <div class="pp-photo">
        ${src ? `<img id="ppMainImg" src="${src}" alt="${p.name}${cap?' — '+cap:''}">` : `<span class="ph">Photo coming soon</span>`}
      </div>
      ${cap ? `<div class="pp-caption">Shown: ${cap}</div>` : ``}
      ${thumbs}`;
  }
  function metaHTML(){
    const rows = [];
    rows.push(["SKU", selectedSku(p, sel)]);
    rows.push(["Fits", p.fits]);
    if(p.unit) rows.push(["Sold as", "1 " + p.unit]);
    if(p.delayed) rows.push(["Availability", "Backordered ~4 weeks"]);
    else rows.push(["Availability", "Made to order"]);
    return `<dl class="pp-meta">${rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>`;
  }
  function extraSectionsHTML(){
    let html = "";
    if(p.details){
      html += `<section class="pp-section"><h2>Details</h2><div class="pp-longtext">${p.details}</div></section>`;
    }
    if(gallery.length || reviewsLoaded) html += galleryHTML();
    if(p.video){
      html += `<section class="pp-section"><h2>Install Video</h2><div class="pp-video"><iframe src="${p.video}" title="${p.name} install video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div></section>`;
    }
    html += reviewsHTML();
    return html;
  }

  /* ---------- gallery: customer photos from approved reviews ---------- */
  let reviewsLoaded = false;
  let gallery = galleryFor(p, []);
  function galleryHTML(){
    const head = `<div class="cg-head">
        <div><h2>Gallery</h2><p>${gallery.length ? "Real installs from real owners." : "No customer photos yet — yours could be the first."}</p></div>
        <button class="btn-dark" id="galleryShare">Share your install →</button>
      </div>`;
    if(!gallery.length) return `<section class="pp-section">${head}
      <p class="cg-empty">Installed yours? Add photos when you write a review — once it's approved they show up here.</p></section>`;
    return `<section class="pp-section">${head}
      <div class="cg-grid">${gallery.map((g,i)=>`
        <button class="cg-item" data-i="${i}" aria-label="View photo: ${escapeHTML(g.cap)}">
          <img src="${escapeHTML(g.src)}" alt="${escapeHTML(g.cap)}" loading="lazy"><span class="cap">${escapeHTML(g.cap)}</span>
        </button>`).join("")}</div>
    </section>`;
  }

  /* ---------- reviews ---------- */
  let reviews = (p.reviews || []).slice();   // built-in reviews; approved sheet reviews are added on load
  let avg = 0;
  function recalcAvg(){ avg = reviews.length ? reviews.reduce((s,r)=>s+r.stars,0) / reviews.length : 0; }
  recalcAvg();
  const starStr = n => "★".repeat(Math.round(n)) + "☆".repeat(5 - Math.round(n));
  let rvFilter = "all";
  function ratingLineHTML(){
    if(!reviews.length) return "";
    return `<a class="pp-rating" href="#reviews"><span class="stars" aria-hidden="true">${starStr(avg)}</span><b>${avg.toFixed(1)}</b><span class="count">${reviews.length} review${reviews.length===1?"":"s"}</span></a>`;
  }
  function reviewsHTML(){
    if(!reviews.length){
      return `<section class="pp-section" id="reviews">
        <h2>Reviews</h2>
        <div class="rv-wrap">
          <aside class="rv-summary">
            <div class="rv-empty-title">No reviews yet</div>
            <p class="rv-empty-sub">Bought these? Be the first to tell other owners how they fit and look.</p>
            <button class="btn-wrb" id="openReview">Write a review</button>
          </aside>
        </div>
      </section>`;
    }
    const counts = [5,4,3,2,1].map(s=>reviews.filter(r=>r.stars===s).length);
    const withPhotos = reviews.filter(r=>r.photos && r.photos.length);
    const list = rvFilter==="photos" ? withPhotos : reviews;
    return `<section class="pp-section" id="reviews">
      <h2>Reviews</h2>
      <div class="rv-wrap">
        <aside class="rv-summary">
          <div class="rv-avg">${avg.toFixed(1)}</div>
          <div class="stars" aria-label="${avg.toFixed(1)} out of 5 stars">${starStr(avg)}</div>
          <div class="basis">Based on ${reviews.length} review${reviews.length===1?"":"s"}</div>
          ${[5,4,3,2,1].map((s,i)=>`<div class="rv-bar"><span>${s} ★</span><span class="track"><span class="fill" style="width:${counts[i]/reviews.length*100}%"></span></span><span>${counts[i]}</span></div>`).join("")}
          <button class="btn-wrb" id="openReview">Write a review</button>
        </aside>
        <div>
          ${withPhotos.length ? `<div class="rv-filters">
            <button class="rv-chip ${rvFilter!=="photos"?'on':''}" data-f="all">All reviews (${reviews.length})</button>
            <button class="rv-chip ${rvFilter==="photos"?'on':''}" data-f="photos">With photos (${withPhotos.length})</button>
          </div>` : ``}
          <div class="rv-list">${list.map(r=>`
            <article class="rv-card">
              <div class="top"><span class="stars" aria-label="${r.stars} out of 5 stars">${starStr(r.stars)}</span>${r.date?`<span class="date">${escapeHTML(r.date)}</span>`:``}</div>
              ${r.title?`<h4>${escapeHTML(r.title)}</h4>`:``}
              <div class="body">${escapeHTML(r.body)}</div>
              ${r.photos && r.photos.length?`<div class="rv-photos" data-who="${escapeHTML(r.who)}">${r.photos.map(ph=>`<button data-full="${escapeHTML(ph.full||ph)}" aria-label="View customer photo"><img src="${escapeHTML(ph.src||ph)}" alt="Customer photo" loading="lazy"></button>`).join("")}</div>`:``}
              <div class="meta"><b>${escapeHTML(r.who)}</b>${r.verified?`<span class="verified">Verified order</span>`:``}${r.config?`<span class="rv-config">${escapeHTML(r.config)}</span>`:``}</div>
            </article>`).join("")}</div>
        </div>
      </div>
    </section>`;
  }

  function render(){
    $("ppMain").innerHTML = `
      <div class="pp">
        <div class="crumb"><a href="index.html">Home</a><span>/</span><a href="${sectionHref}">${sectionLabel}</a><span>/</span>${p.name}</div>
        <div class="pp-grid">
          <div class="pp-media">${photoHTML()}</div>
          <div class="pp-info">
            <span class="fits">${p.fits}</span>
            <h1>${p.name}</h1>
            ${ratingLineHTML()}
            <span class="pp-sku" id="ppSku">${selectedSku(p, sel)}</span>
            <div class="pp-price" id="ppPrice"></div>
            <p class="pp-desc">${p.desc}</p>
            ${noticesHTML()}
            <div id="ppOptions">${optionsHTML()}</div>
            <div class="optgroup"><span class="optlabel">Quantity</span>
              <div class="qtyrow"><div class="qtybox">
                <button id="qtyMinus" aria-label="Decrease quantity">−</button>
                <span id="qtyVal">${qty}</span>
                <button id="qtyPlus" aria-label="Increase quantity">+</button>
              </div></div>
            </div>
            <div class="pp-addrow">
              <button class="pp-add" id="ppAdd">Add to order</button>
            </div>
            ${metaHTML()}
          </div>
        </div>
        ${extraSectionsHTML()}
      </div>`;
    refreshPrice();
    bindControls();
  }
  function refreshPrice(){
    $("ppPrice").innerHTML = `${fmt(selectedPrice(p, sel) * qty)}${p.unit ? ` <span class="unit">/ ${p.unit}</span>` : ``}`;
    if($("ppSku")) $("ppSku").textContent = selectedSku(p, sel);
  }
  function bindControls(){
    document.querySelectorAll("#ppOptions .optbtn").forEach(b=>{
      b.onclick = ()=>{
        if(b.disabled) return;
        sel[b.dataset.group] = b.dataset.choice;
        normalizeSel(p, sel);   // e.g. switching to White LED drops Clear → Frosted
        mainOverride = null;
        render();
      };
    });
    document.querySelectorAll(".pp-thumb").forEach(t=>{
      t.onclick = ()=>{ mainOverride = t.dataset.src; const img=$("ppMainImg"); if(img) img.src = mainOverride; };
    });
    $("qtyPlus").onclick = ()=>{ qty=Math.min(20,qty+1); $("qtyVal").textContent=qty; refreshPrice(); };
    $("qtyMinus").onclick = ()=>{ qty=Math.max(1,qty-1); $("qtyVal").textContent=qty; refreshPrice(); };
    $("ppAdd").onclick = ()=>{
      addToCart({ sku:selectedSku(p, sel), name:p.name, price:selectedPrice(p, sel), qty, options:{...sel} });
      if(window.matchMedia("(max-width:640px)").matches){ showToast("Added to your order"); }
      else { openDrawer(); }
    };
    document.querySelectorAll(".cg-item").forEach(b=> b.onclick = ()=> openLB(gallery.map(g=>({src:g.full||g.src, cap:g.cap})), +b.dataset.i));
    document.querySelectorAll(".rv-photos").forEach(box=>{
      const btns = [...box.querySelectorAll("button")], cap = "Customer photo · " + box.dataset.who;
      btns.forEach((b,i)=> b.onclick = ()=> openLB(btns.map(x=>({src:x.dataset.full, cap})), i));
    });
    if($("galleryShare")) $("galleryShare").onclick = openRV;
    document.querySelectorAll(".rv-chip").forEach(c=> c.onclick = ()=>{ rvFilter = c.dataset.f; render(); document.getElementById("reviews").scrollIntoView(); });
    if($("openReview")) $("openReview").onclick = openRV;
  }

  /* ---------- photo viewer ---------- */
  let lbList = [], lbIdx = 0;
  function showLB(){ const it = lbList[lbIdx]; $("lbImg").src = it.src; $("lbImg").alt = it.cap || ""; $("lbCap").textContent = it.cap || ""; }
  function openLB(list, i){
    lbList = list; lbIdx = i; showLB();
    $("lbPrev").style.display = $("lbNext").style.display = list.length > 1 ? "" : "none";
    $("lightbox").classList.add("open"); document.body.style.overflow = "hidden";
  }
  function closeLB(){ $("lightbox").classList.remove("open"); document.body.style.overflow = ""; }
  $("lbClose").onclick = closeLB;
  $("lbPrev").onclick = ()=>{ lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; showLB(); };
  $("lbNext").onclick = ()=>{ lbIdx = (lbIdx + 1) % lbList.length; showLB(); };
  $("lightbox").onclick = e=>{ if(e.target.id === "lightbox") closeLB(); };
  document.addEventListener("keydown", e=>{
    if($("lightbox").classList.contains("open")){
      if(e.key === "Escape") closeLB();
      if(e.key === "ArrowLeft") $("lbPrev").click();
      if(e.key === "ArrowRight") $("lbNext").click();
    } else if($("rvModal").classList.contains("open") && e.key === "Escape") closeRV();
  });

  /* ---------- write a review (to the review sheet, with photos) ---------- */
  function reviewConfigs(){
    const led = (p.options||[]).find(o=>o.label==="LED Type");
    if(led){
      return led.choices.filter(c=>!c.soldOut).flatMap(c=>(c.lenses||[""]).map(l=> l ? `${c.name} · ${l}` : c.name));
    }
    const first = (p.options||[])[0];
    return first ? optionChoiceList(first).map(choiceName) : [];
  }
  let rvStars = 0;
  function setStars(n){ rvStars = n; document.querySelectorAll("#starPick button").forEach(x=>x.classList.toggle("on", +x.dataset.v <= n)); }
  function openRV(){
    $("rvSub").textContent = `${p.name} — reviews are posted after we match them to your order.`;
    const cfgs = reviewConfigs();
    $("rvConfigWrap").style.display = cfgs.length ? "" : "none";
    $("rvConfig").innerHTML = `<option value="">Select…</option>` + cfgs.map(c=>`<option>${c}</option>`).join("");
    $("rvStatus").className = "statusmsg";
    renderPicks();
    $("rvModal").classList.add("open"); document.body.style.overflow = "hidden";
  }
  /* photo picker: up to 3, with previews */
  let rvFiles = [];
  function renderPicks(){
    $("rvPick").innerHTML = rvFiles.map((f,i)=>`<div class="pick"><img src="${f.url}" alt=""><button type="button" data-i="${i}" aria-label="Remove photo">×</button></div>`).join("")
      + (rvFiles.length < 3 ? `<button type="button" class="pick add" id="rvAddPhoto">+<span>Add photo</span></button>` : "");
    $("rvPick").querySelectorAll(".pick button[data-i]").forEach(b=> b.onclick = ()=>{
      const [gone] = rvFiles.splice(+b.dataset.i, 1); URL.revokeObjectURL(gone.url); renderPicks();
    });
    if($("rvAddPhoto")) $("rvAddPhoto").onclick = ()=> $("rvFiles").click();
  }
  function clearPicks(){ rvFiles.forEach(f=>URL.revokeObjectURL(f.url)); rvFiles = []; renderPicks(); }
  $("rvFiles").onchange = e=>{
    [...e.target.files].filter(f=>/^image\//.test(f.type)).slice(0, 3 - rvFiles.length)
      .forEach(file=> rvFiles.push({ file, url:URL.createObjectURL(file) }));
    e.target.value = ""; renderPicks();
  };
  function closeRV(){ $("rvModal").classList.remove("open"); document.body.style.overflow = ""; }
  document.querySelectorAll("#starPick button").forEach(b=> b.onclick = ()=> setStars(+b.dataset.v));
  $("rvCancel").onclick = closeRV;
  $("rvModal").onclick = e=>{ if(e.target.id === "rvModal") closeRV(); };
  $("rvSubmit").onclick = async ()=>{
    const st = $("rvStatus"); st.className = "statusmsg";
    const headline = $("rvHeadline").value.trim(), body = $("rvBody").value.trim();
    const name = $("rvName").value.trim(), email = $("rvEmail").value.trim();
    const err = msg => { st.textContent = msg; st.classList.add("err"); };
    if(!rvStars) return err("Please pick a star rating.");
    if(!headline || !body) return err("Please add a headline and your review.");
    if(!name) return err("Please add the name you'd like shown.");
    if(!email.includes("@")) return err("Please add the email you ordered with so we can verify it.");
    const files = rvFiles.map(f=>f.file);
    $("rvSubmit").disabled = true; $("rvSubmit").textContent = files.length ? "Uploading photos…" : "Sending…";
    try{
      await submitReview({
        product: p.name, rating: rvStars, headline, review: body,
        name, email, purchased: $("rvConfig").value || "", website: $("rvWebsite").value
      }, files);
      st.textContent = files.length ? "Thanks! Your review and photos will show up once we match them to your order."
                                    : "Thanks! Your review will show up once we match it to your order.";
      st.classList.add("ok");
      ["rvHeadline","rvBody","rvName","rvEmail"].forEach(id=> $(id).value = ""); setStars(0); clearPicks();
      setTimeout(closeRV, 2400);
    }catch(e){
      err(e && e.message === "unreadable" ? "One of those photos couldn't be read — try a JPG or PNG."
                                          : "Couldn't send — try again, or DM us on Instagram.");
    }finally{
      $("rvSubmit").disabled = false; $("rvSubmit").textContent = "Submit review";
    }
  };

  render();

  loadSheetReviews().then(list=>{
    reviewsLoaded = true;
    gallery = galleryFor(p, list);
    const mine = list.filter(r=>r.product.toLowerCase() === p.name.toLowerCase());
    reviews = mine.concat(reviews);
    recalcAvg();
    render();
  });
}
</script>
</body>
</html>
